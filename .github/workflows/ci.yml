name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run test suite (no network, no model call)
        run: python -m pytest tests/ -v

  syntax-and-dependencies:
    name: syntax + dependency resolution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile every Python source file
        run: python -m compileall -q .

      # The application itself is not started here: main.py is a Streamlit app and
      # requires a GROQ_API_KEY secret. CI verifies that the sources compile and
      # that the declared dependency set resolves.
      - name: Verify requirements resolve
        run: |
          python -m pip install --upgrade pip
          python -m pip install --dry-run -r requirements.txt
