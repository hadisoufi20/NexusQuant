name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-dependencies:
    name: syntax + dependency resolution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile every Python source file
        run: python -m compileall -q .

      # The application itself is not started here: main.py is a Streamlit app and
      # requires a GROQ_API_KEY secret. CI only verifies that the sources compile
      # and that the declared dependency set is resolvable.
      - name: Verify requirements resolve
        run: |
          python -m pip install --upgrade pip
          python -m pip install --dry-run -r requirements.txt

      - name: Report tracked file inventory
        run: git ls-files
